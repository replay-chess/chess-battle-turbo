# Which phase owns which paths while it runs (phase-01 plan §13.5, P1-16; critique-feasibility §7).
#
# scripts/qa/check-owners.mjs lists, for a PR or push, every changed file that another ACTIVE phase owns.
# Report-only in P1 (one stream of feature work). From `enforce_from_phase` on (P4, when two streams run) it
# blocks, and a PR that touches another active phase's globs needs the label `owner-ok:<phase id>`.
#
# Format (a small YAML subset that check-owners.mjs parses without dependencies):
#   - `key: value` scalars, nested maps by two-space indentation, `- item` lists of scalars, `#` comments.
#   - globs use node:path matchesGlob syntax, relative to the repo root.
#   - `status`: planned | active | done. Only `active` phases own anything for the check; set a phase to
#     active when its first PR opens and to done at sign-off. `weeks` are calendar estimates (allocation.md
#     §0, P1 starting 2026-11-02), for planning only.
#   - `shared_add_only`: registry directories (registries are directories, CF §7). Any phase may ADD a file
#     there; changing an existing file is a cross-phase touch when another active phase owns it. Barrel files
#     (`index.ts`) take one appended line per phase and are reported, never blocked.
version: 1
enforce_from_phase: 4
calendar_start: 2026-11-02

shared_add_only:
  - apps/web/lib/api/keys/
  - apps/web/lib/flags/registry/
  - apps/web/lib/auth/route-classes/
  - apps/web/lib/cron/tasks/
  - packages/contracts/src/http/registry/
  - apps/web/e2e/personas/
  - apps/web/config/redirects/
  - apps/web/lib/seo/robots-rules/
  - apps/web/lib/realtime/handlers/

phases:
