    name: Design system, app shell, API foundations
    status: active
    weeks: 1-3
    globs:
      - apps/web/components/ui/**
      - apps/web/components/shell/**
      - apps/web/components/layout/**
      - apps/web/components/system/**
      - apps/web/components/data/**
      - apps/web/app/dev/**
      - apps/web/app/too-many-requests/**
      - apps/web/app/(app)/layout.tsx
      - apps/web/app/providers.tsx
      - apps/web/middleware.ts
      - apps/web/lib/api/*.ts
      - apps/web/lib/api/queries/**
      - apps/web/lib/api/keys/me.ts
      - apps/web/lib/api/keys/catalog.ts
      - apps/web/lib/api/keys/billing.ts
      - apps/web/lib/api/keys/system.ts
      - apps/web/lib/auth/**
      - apps/web/lib/shell/**
      - apps/web/lib/layout/**
      - apps/web/lib/nav/**
      - apps/web/lib/flags/*.ts
      - apps/web/lib/flags/registry/p01.ts
      - apps/web/lib/test-hooks/**
      - apps/web/lib/rate-limit-db*.ts
      - apps/web/lib/webhooks/**
      - apps/web/lib/billing/entitlement*.ts
      - apps/web/lib/cron/tasks/@(rate-limit-sweep|webhook-retention|membership-reconcile).ts
      - apps/web/app/api/@(me|health|session|cron)/**
      - apps/web/app/api/billing/refresh/**
      - apps/web/app/api/webhook/**
      - apps/web/test/**
      - apps/web/e2e/fixtures/**
      - apps/web/e2e/devices/**
      - apps/web/e2e/personas/p01.ts
      - apps/web/scripts/@(lint-delta|check-bundle-budgets).mjs
      - apps/web/.lint-baseline.json
      - packages/contracts/src/http/*.ts
      - packages/analytics/**
      - scripts/qa/**
      - scripts/db/**
      - .github/workflows/@(ci|main-guard|nightly|post-deploy-dev|ops-weekly|backup-live).yml
      - OWNERS.yml
      - turbo.json

  p02:
    name: Board and live game
    status: planned
    weeks: 4-9
    globs:
