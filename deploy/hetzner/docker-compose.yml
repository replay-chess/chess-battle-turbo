# Production stack on the Hetzner server, run from /opt/replay-chess.
# Images are built by .github/workflows/deploy-hetzner.yml; the same workflow
# writes .env next to this file (app secrets + WEB_IMAGE / WS_IMAGE tags).

services:
  web:
    image: ${WEB_IMAGE}
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: &logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  websocket:
    image: ${WS_IMAGE}
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3002
      # Socket -> web API calls stay on the Docker network
      - WEB_APP_URL=http://web:3000
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - websocket
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
