# WebSocket stack on the OCI server, run from /opt/replay-chess. The Next.js
# app runs on Vercel. The image is built by .github/workflows/deploy-oci.yml;
# the same workflow writes .env next to this file (secrets + WS_IMAGE tag).

services:
  websocket:
    image: ${WS_IMAGE}
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3002
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: &logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - WS_HOST=${WS_HOST:-ws-chess.playchess.tech}
    depends_on:
      - websocket
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
