# WebSocket stack on the OCI server, run from /opt/replay-chess. The Next.js
# app runs on Vercel. The image is built by .github/workflows/deploy-oci.yml;
# the same workflow writes .env next to this file (secrets + WS_IMAGE tag).
#
# The analysis worker (phase-03 plan §3.2, P3-D8) is in compose profile `worker`:
# only the dev bundle's .env sets COMPOSE_PROFILES=worker, WORKER_IMAGE and ships
# .env.worker (secret WORKER_DEV_ENV_FILE). The prod bundle has none of them, so
# a push to main never starts a worker on prod (the prod worker is P13's VM).

services:
  websocket:
    image: ${WS_IMAGE}
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3002
      # The game journal (phase-02 plan 7.6): survives container replacement on the ws_journal volume.
      - JOURNAL_DIR=/data/journal
    # APP_ENV, DATABASE_URL, SOCKET_TOKEN_SECRET, INTERNAL_API_SECRET, ALLOWED_ORIGINS, PROTOCOL_V1 and
    # DRAIN_NOTICE_SECONDS come from .env (WS_ENV_FILE / WS_DEV_ENV_FILE).
    restart: unless-stopped
    # On SIGTERM the server freezes every clock, fsyncs the journal and flushes every game to the database
    # (at most 20 s), then closes. Give it that time before Docker sends SIGKILL (plan 7.6 "Drain").
    stop_grace_period: 30s
    volumes:
      - ws_journal:/data/journal
    # /ready: 503 while draining, before the boot restore finished, or with an outbox older than 60 s.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3002/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: &logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  analysis-worker:
    profiles: ["worker"]
    image: ${WORKER_IMAGE:-replay-chess-analysis-worker:not-deployed}
    env_file:
      - path: .env.worker
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3003
      - ENGINE_PATH=/usr/local/bin/stockfish
      - EVAL_CACHE_PATH=/data/evalcache/evals.sqlite
      - WS_INTERNAL_URL=http://websocket:3002
    # APP_ENV=dev, WORKER_DATABASE_URL (role replay_worker), INTERNAL_API_SECRET (ring: wk first, then ws, webwk, opswk;
    # never web or ops, the worker refuses to boot holding them), WORKER_ID=dev-worker, EVAL_CACHE_SEED_URL,
    # SENTRY_DSN, POSTHOG_PROJECT_KEY, POSTHOG_HOST come from .env.worker. Every worker that runs at the same time
    # needs its own WORKER_ID (a laptop worker without one gets <APP_ENV>-<host>).
    #
    # P4 imports (phase-04 plan §7.9; all optional, defaults in parentheses), also from .env.worker:
    # UPSTREAM_CONTACT (hello@playchess.tech, the provider User-Agent contact), IMPORT_WINDOW_MONTHS (12),
    # IMPORT_MAX_GAMES (2000), IMPORT_ANALYSE_EAGER_TRIAL (20), IMPORT_ANALYSE_EAGER (50), IMPORT_ANALYSE_CAP (200),
    # IMPORT_BACKLOG_SPREAD_DAYS (7), IMPORT_PAUSED (off: the ops kill switch, the I/O lane claims nothing),
    # BILLING_PAYWALL (on), HASH_PEPPER, and on the dev box only IMPORT_FAULTS_ALLOWED=1 (the /dev/import fault table;
    # the worker refuses to boot with it when APP_ENV=production). CHESSCOM_API_BASE / LICHESS_BASE_URL stay unset
    # here (the real providers; any other value is refused with APP_ENV=production).
    #
    # P5 Mistake Bank (phase-05 plan §7.8; optional, defaults in parentheses), also from .env.worker:
    # BANK_EXTRACT_ENABLED (on: the kill switch, off skips the extraction and leaves EXTRACT_MISTAKES rows queued),
    # BANK_LINE_NODES (500000: the node budget of one puzzle-line search).
    #
    # CPU isolation (P3-D8): the container's cgroup lives under worker-idle.slice (CPUWeight=idle, so cpu.idle = 1,
    # created by setup-server.sh): under contention the socket container always wins. On top of that a hard cap of
    # 0.75 core and the worker's own lag pause (it waits while the socket's loop-lag p99 > LAG_PAUSE_MS).
    cgroup_parent: worker-idle.slice
    cpus: "0.75"
    mem_limit: 1g
    restart: unless-stopped
    # Docker's init (tini) is PID 1 and node its child: tini forwards SIGTERM (the drain below) and reaps zombies, and a
    # crash is injectable for owner test T11. With node as PID 1 the kernel ignored `kill -9 1` from inside the
    # container (a PID-namespace init), so the worker could not be crashed at all (dev pass D5). T11:
    # `docker compose exec analysis-worker sh -c 'kill -9 -1'` (every process but init: node dies, tini exits 137,
    # the restart policy restarts it; `docker kill` would be a manual stop, R14).
    init: true
    # SIGTERM: stop claiming, checkpoint the running analysis, release it without counting the attempt, exit.
    stop_grace_period: 30s
    volumes:
      - worker_evalcache:/data/evalcache
    # /ready: 200 once the engine answered readyok and the eval cache is open. Never published on the host; Caddy
    # proxies only the signed /internal/analysis/* to it.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - websocket
    logging: *logging

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - WS_HOST=${WS_HOST:-ws-chess.playchess.tech}
      # `worker` on the dev box only (the deploy writes it into .env): the Caddyfile proxies the worker routes then.
      - COMPOSE_PROFILES=${COMPOSE_PROFILES:-}
      # APP_ENV from the stack's .env (dev / production): the worker's /internal/dev/* is proxied only with `dev`.
      - APP_ENV=${APP_ENV:-}
    depends_on:
      - websocket
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  ws_journal:
  worker_evalcache:
