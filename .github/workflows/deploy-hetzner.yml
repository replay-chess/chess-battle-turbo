name: Deploy to Hetzner

# Builds the web + websocket images on GitHub's runners (the 4 GB server is
# too small to build Next.js comfortably), pushes them to GHCR, then pulls
# and restarts the stack on the server.
#
# Secrets:
#   PROD_ENV_FILE    full production .env (see apps/web/.env.example and
#                    apps/web-socket/.env.example); used for the build and
#                    written to /opt/replay-chess/.env on the server
#   HETZNER_HOST     server IP
#   HETZNER_SSH_KEY  private key of the `deploy` user (deploy/hetzner/setup-server.sh)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/replay-chess-web:${{ github.sha }}
  WS_IMAGE: ghcr.io/${{ github.repository_owner }}/replay-chess-websocket:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write build env
        run: printf '%s\n' "$PROD_ENV_FILE" > "$RUNNER_TEMP/build.env"
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}
          secret-files: buildenv=${{ runner.temp }}/build.env
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build and push websocket
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-socket/Dockerfile
          push: true
          tags: ${{ env.WS_IMAGE }}
          cache-from: type=gha,scope=websocket
          cache-to: type=gha,scope=websocket,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/hetzner

      - name: Assemble bundle
        run: |
          mkdir -p bundle
          cp deploy/hetzner/docker-compose.yml deploy/hetzner/Caddyfile bundle/
          {
            printf '%s\n' "$PROD_ENV_FILE"
            echo "WEB_IMAGE=$WEB_IMAGE"
            echo "WS_IMAGE=$WS_IMAGE"
          } > bundle/.env
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}

      - name: Copy bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "bundle/docker-compose.yml,bundle/Caddyfile,bundle/.env"
          target: /opt/replay-chess
          strip_components: 1

      - name: Restart stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            cd /opt/replay-chess
            chmod 600 .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            docker compose ps
