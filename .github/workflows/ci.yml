# CI on the dev branch (phase-01 plan §13.4, 1B·F7; CT X1, X2, X16).
#
# verify       gitleaks (full history + baseline), types, orphan-test guard, unit tests, lint delta,
#              Prisma drift gate, OpenAPI diff, test-mode build, bundle budget (blocking), OWNERS report
# integration  Docker Postgres: migrate deploy + seeds, then every *.int.test.ts and the Postgres part of
#              lib/webhooks/record.test.ts
# e2e-smoke    paywall on, test hooks on, the v2 socket servers from source (:3002 app socket, :3102 fast fixture,
#              :3103 restartable; e2e/fixtures/socket-server.ts) with per-run keys: the authz walker over HTTP,
#              then Playwright @smoke on chromium + webkit-iphone + game-serial (P2 plan 12.6)
# devices-game the P2 game one-viewport suite on P1's PR device tier (4 projects, plan 12.7)
# devices-review the P3 screens on the same PR tier (phase-03 plan §12.3), with a Docker database for /r/<code>
# devices-p4   the P4 screens (onboarding, connected accounts, activating) on the same PR tier + the P4 axe spec
# P4 (phase-04 plan §12.4, WP-H): e2e-smoke runs the upstream mock (e2e/mocks/upstream-server.ts, :4010: Chess.com,
#              Lichess, Dodo; Playwright starts it) with the onboarding and import flags on, per-run SIGNED_COOKIE_SECRET
#              and HASH_PEPPER, the worker with IMPORT_FAULTS_ALLOWED=1; its @smoke set gains the P4 happy path, Lichess,
#              connected accounts, checkout activating and the archive (desktop + iPhone). devices-p4 runs the onboarding,
#              connected-accounts and activating one-viewport specs (with their CLS gate) on the PR tier and the P4 axe
#              spec on ui-desktop and ui-iphone.
# P3 (phase-03 plan §12, WP-H): integration also loads the 2,000-game perf seed and runs the P3 EXPLAIN gate
#              (scripts/explain-hot.ts, report artifact perf/results/p03-explain-<sha>.json); e2e-smoke runs the
#              analysis worker from source on :3003 (ENGINE=fake, APP_ENV=test, role replay_worker) with the review
#              flags on, and the run's HMAC ring holds web, ws and wk keys (each process signs with its own kid).
#
# CI never touches Neon: every database here is a service container. `main` has its own guard
# (main-guard.yml); this workflow does not run there, because main has none of the new packages until P13.
#
# Secrets (owner adds; names only): E2E_TEST_TOKEN, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY and CLERK_SECRET_KEY
# (Clerk development instance; e2e-smoke, devices-game and devices-review), INTERNAL_API_SECRET, E2E_USER_{A..P,R}_{EMAIL,PASSWORD}.
# The verify and integration jobs need none.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    services:
      shadow:
        image: postgres:17
        env: { POSTGRES_PASSWORD: shadow }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      # Prisma reads these from schema.prisma even for `generate` and `migrate diff`; nothing connects to them
      # except the drift gate's shadow database and the build (which must not need a database).
      DATABASE_URL: postgresql://postgres:shadow@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:shadow@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: gitleaks (full history, redacted, against the baseline)
        # `--redact` is required: the committed baseline is redacted, and gitleaks matches a finding against it
        # only when redaction is on. The :v8 tag does not exist; pin the version.
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo
          --log-opts=--all --redact --no-banner
          --config /repo/.gitleaks.toml --baseline-path /repo/.gitleaks-baseline.json

      - run: pnpm --filter @repo/db generate

      - name: Type check (web, socket and the packages)
        run: |
          pnpm --filter web check-types
          pnpm --filter web-socket check-types
          pnpm --filter @repo/contracts check-types
          pnpm --filter @repo/analytics check-types
          pnpm --filter @repo/db check-types
          pnpm --filter @repo/game-core check-types
          pnpm --filter @repo/chess-fixtures check-types
          pnpm --filter @repo/chess-analysis check-types
          pnpm --filter @repo/chess-import check-types
          pnpm --filter @repo/chess-training check-types
          pnpm --filter analysis-worker check-types

      - name: Orphan-test guard
        run: node scripts/qa/check-test-globs.mjs

      - name: Unit tests (web, socket and the packages)
        run: |
          pnpm --filter web test:unit
          pnpm --filter @repo/contracts test
          pnpm --filter @repo/analytics test
          pnpm --filter @repo/db test
          pnpm --filter @repo/game-core test
          pnpm --filter @repo/chess-fixtures test
          pnpm --filter web-socket test
          pnpm --filter @repo/chess-analysis test
          pnpm --filter @repo/chess-import test
          pnpm --filter @repo/chess-training test
          pnpm --filter analysis-worker test

      - name: Lint the P3, P4 and P5 packages (--max-warnings 0)
        run: |
          pnpm --filter @repo/chess-analysis lint
          pnpm --filter @repo/chess-import lint
          pnpm --filter @repo/chess-training lint
          pnpm --filter analysis-worker lint

      - name: Licence gate for the grading library and the worker (deep, no AGPL/GPL; phase-03 A7)
        run: pnpm --filter @repo/chess-analysis license-check

      - name: Lint delta (warnings ≤ baseline, 0 errors; SPEC D19)
        run: node apps/web/scripts/lint-delta.mjs --all

      - name: Prisma drift gate (migrations == schema.prisma)
        # ADB §4.3 step 6, P2 plan 6.5 step 3: check-drift.ts replays the migrations into the (reset) shadow database
        # and fails on any difference except DROP INDEX of a name in packages/db/prisma/protected-indexes.txt and the
        # storage-parameter lines Prisma does not model (a raw --exit-code diff cannot tell those from drift, CC 1.7).
        run: pnpm tsx scripts/db/check-drift.ts --shadow-database-url postgresql://postgres:shadow@localhost:5432/postgres

      - name: OpenAPI is regenerated
        run: |
          pnpm --filter @repo/contracts openapi
          git diff --exit-code docs/api/openapi.json

      - name: Build (test app env, hooks on, blank telemetry, dummy keys)
        # Dummy keys only: the build must not need a real Clerk instance, Dodo account or database.
        # (/api/checkout constructs the Dodo client at module load, so the build needs some API key.)
        env:
          NEXT_PUBLIC_APP_ENV: test
          ALLOW_TEST_HOOKS: "1"
          ROUTE_VALIDATE_RESPONSES: "1"
          NEXT_PUBLIC_POSTHOG_KEY: ""
          NEXT_PUBLIC_SENTRY_DSN: ""
          SENTRY_DSN: ""
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ""
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_ci_dummy_not_a_real_key
          NEXT_PUBLIC_WEBSOCKET_URL: ws://localhost:3002
          DODO_PAYMENTS_API_KEY: ci-dummy-dodo-key
          DODO_PAYMENTS_ENVIRONMENT: test_mode
        run: |
          set -o pipefail
          pnpm --filter web build 2>&1 | tee next-build.log

      - name: Service worker never caches documents, fetches, /api or RSC (plan 9.3, H8)
        run: node apps/web/scripts/check-sw-routes.mjs

      - name: Service worker precache holds only built files, no source maps, within budget (install must succeed)
        run: node apps/web/scripts/check-sw-precache.mjs

      - name: Bundle budget (blocking; +25 kB shared, no zod or Query devtools in client chunks)
        run: node apps/web/scripts/check-bundle-budgets.mjs --json bundle-report.json

      - name: Caddy routes per compose profile (worker routes only on the worker box)
        run: deploy/oci/check-caddy-routes.sh

      - name: OWNERS report (report-only until P4)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/qa/check-owners.mjs --report --base "$BASE_SHA" --head "$HEAD_SHA" --labels "$PR_LABELS"

      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify-reports
          path: |
            next-build.log
            bundle-report.json
          retention-days: 14
          if-no-files-found: ignore

  integration:
    needs: verify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    services:
      db:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: replay }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/replay
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/replay
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/replay
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/db generate
      - name: Migrate and seed
        # The integration suites need seed.ts and opening-seed.ts only; the design legends (seed:content) are seeded
        # in e2e-smoke, where the legend specs run.
        run: |
          pnpm --filter @repo/db migrate:deploy
          pnpm --filter @repo/db seed
          pnpm --filter @repo/db seed:openings
      - name: Realtime role for the socket and @repo/db suites (packages/db/sql/roles.sql)
        # P2 plan 12.4 / WP-D: the socket's int tests run as replay_realtime (column grants, no gameData) when
        # TEST_REALTIME_DATABASE_URL is set; without it the DB suites of apps/web-socket skip.
        run: |
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          RT_PW=$(openssl rand -hex 16)
          echo "::add-mask::$RT_PW"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v rt_password="$RT_PW" -f packages/db/sql/roles.sql
          echo "TEST_REALTIME_DATABASE_URL=postgresql://replay_realtime:$RT_PW@localhost:5432/replay" >> "$GITHUB_ENV"
      - name: Phase 3 roles (socket.p3.sql, replay_app + replay_app.p3.sql, replay_worker.sql)
        # phase-03 plan 6.3/6.7: the M3 grants. m3.int.test.ts asserts each role's grants and jobs.int.test.ts runs
        # the web's enqueue as replay_app; without these URLs those cases skip.
        run: |
          APP_PW=$(openssl rand -hex 16)
          WK_PW=$(openssl rand -hex 16)
          echo "::add-mask::$APP_PW"
          echo "::add-mask::$WK_PW"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/scripts/roles/socket.p3.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v app_password="$APP_PW" -f scripts/db/replay-app-role.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/scripts/roles/replay_app.p3.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v wk_password="$WK_PW" -f packages/db/scripts/roles/replay_worker.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/scripts/roles/replay_app.p4.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/scripts/roles/replay_worker.p4.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/scripts/roles/replay_app.p5.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/scripts/roles/replay_worker.p5.sql
          pnpm --filter @repo/db exec tsx scripts/check-p4-preconditions.ts --url "$DATABASE_URL" --expect-m4
          echo "TEST_APP_DATABASE_URL=postgresql://replay_app:$APP_PW@localhost:5432/replay" >> "$GITHUB_ENV"
          echo "TEST_WORKER_DATABASE_URL=postgresql://replay_worker:$WK_PW@localhost:5432/replay" >> "$GITHUB_ENV"
      - name: Hot-query gate (index existence + EXPLAIN, phase-02 plan 9.2)
        # docs/indexes.json names must exist; the P2 hot queries must not Seq Scan games/game_players or Sort
        # game_players (planned with seqscan/sort off, so a tiny CI database still proves the index path).
        run: pnpm tsx scripts/explain-hot-queries.ts
      - name: P5 hot-query gate (P5 indexes + EXPLAIN of the Train/Home/review-bank statements, phase-05 plan 9.1)
        # The services' own Prisma.Sql builders (apps/web, which resolves the web's @/ imports). Seq Scan on a P5 table
        # or game_players, or a Sort over the hot ones, fails; the (due, id) keyset tie break is the only allowed
        # Incremental Sort. `--check-indexes` alone is the fast index-existence half.
        run: pnpm --filter web exec tsx scripts/explain-hot-queries.ts
      - name: Integration tests (every *.int.test.ts in every package)
        run: pnpm -r test:int
      - name: Postgres part of the webhook claim test
        run: pnpm --filter web exec tsx --test lib/webhooks/record.test.ts
      - name: P3 perf seed (the 2,000-row member) and the P3 EXPLAIN gate (phase-03 plan §12.7 "Query plans")
        # After the integration suites (they count rows of their own); the report is the TST X18 artifact.
        run: |
          pnpm --filter @repo/db exec tsx seed/perf-archive.ts --apply
          mkdir -p perf/results
          pnpm --filter @repo/db exec tsx scripts/explain-hot.ts --report "$GITHUB_WORKSPACE/perf/results/p03-explain-${GITHUB_SHA}.json"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p03-explain
          path: perf/results/p03-explain-*.json
          retention-days: 30
          if-no-files-found: ignore

  e2e-smoke:
    needs: verify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # 45 + the P5 step (≈ 25 min on 4 workers: three bot/analysis games, the puzzle sessions, the day rollover).
    timeout-minutes: 75
    services:
      db:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: replay }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      CI: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/replay
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/replay
      BILLING_PAYWALL: "on"
      NEXT_PUBLIC_APP_ENV: test
      ALLOW_TEST_HOOKS: "1"
      ROUTE_VALIDATE_RESPONSES: "1"
      NEXT_PUBLIC_TELEMETRY_SINK: "1"
      POSTHOG_HOST: http://127.0.0.1:4011
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_DSN: ""
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ""
      # The v2 socket servers (Playwright webServer + the restartable fixture) share SOCKET_TOKEN_SECRET and
      # INTERNAL_API_SECRET with the web app; both are random per run (below), so no secret is needed.
      NEXT_PUBLIC_WEBSOCKET_URL: ws://localhost:3002
      FLAGS_OVERRIDE: shell-v3:on,live-protocol-v2:on,game-v3:on,review-v3:on,review-share:on,onboarding-v3:on,import-v3:on
      # P4: the providers and Dodo's REST API are the upstream mock (playwright.config.ts starts it on :4010 and points
      # the web and the worker at it; DODO_API_BASE_URL is honoured only by an APP_ENV=test build). The product ids are
      # the mock's; no Dodo, Chess.com or Lichess traffic leaves the runner.
      DODO_API_BASE_URL: http://127.0.0.1:4010/dodo
      CHESSCOM_API_BASE: http://127.0.0.1:4010/chesscom
      LICHESS_BASE_URL: http://localhost:4010/lichess
      LICHESS_CLIENT_ID: replay-chess-dev
      DODO_PRODUCT_ID_MONTHLY: pdt_ci_monthly
      DODO_PRODUCT_ID_YEARLY: pdt_ci_yearly
      # P3: the web and the :3002 socket kick the e2e worker (Playwright starts it, e2e/fixtures/analysis-worker.ts).
      ANALYSIS_WORKER_URL: http://127.0.0.1:3003
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      E2E_TEST_TOKEN: ${{ secrets.E2E_TEST_TOKEN }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      # No real Dodo traffic reaches CI: test-mode env with a dummy API key. The webhook signing keys are
      # random per run (below) and shared by the web server and the Playwright process (webhooks.spec).
      DODO_PAYMENTS_ENVIRONMENT: test_mode
      DODO_PAYMENTS_API_KEY: ci-dummy-dodo-key
      DODO_PAYMENTS_RETURN_URL: http://localhost:3000/pricing?checkout=success
      E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
      E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
      E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
      E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
      E2E_USER_C_EMAIL: ${{ secrets.E2E_USER_C_EMAIL }}
      E2E_USER_C_PASSWORD: ${{ secrets.E2E_USER_C_PASSWORD }}
      E2E_USER_D_EMAIL: ${{ secrets.E2E_USER_D_EMAIL }}
      E2E_USER_D_PASSWORD: ${{ secrets.E2E_USER_D_PASSWORD }}
      E2E_USER_E_EMAIL: ${{ secrets.E2E_USER_E_EMAIL }}
      E2E_USER_E_PASSWORD: ${{ secrets.E2E_USER_E_PASSWORD }}
      E2E_USER_F_EMAIL: ${{ secrets.E2E_USER_F_EMAIL }}
      E2E_USER_F_PASSWORD: ${{ secrets.E2E_USER_F_PASSWORD }}
      E2E_USER_G_EMAIL: ${{ secrets.E2E_USER_G_EMAIL }}
      E2E_USER_G_PASSWORD: ${{ secrets.E2E_USER_G_PASSWORD }}
      E2E_USER_H_EMAIL: ${{ secrets.E2E_USER_H_EMAIL }}
      E2E_USER_H_PASSWORD: ${{ secrets.E2E_USER_H_PASSWORD }}
      E2E_USER_I_EMAIL: ${{ secrets.E2E_USER_I_EMAIL }}
      E2E_USER_I_PASSWORD: ${{ secrets.E2E_USER_I_PASSWORD }}
      E2E_USER_J_EMAIL: ${{ secrets.E2E_USER_J_EMAIL }}
      E2E_USER_J_PASSWORD: ${{ secrets.E2E_USER_J_PASSWORD }}
      E2E_USER_K_EMAIL: ${{ secrets.E2E_USER_K_EMAIL }}
      E2E_USER_K_PASSWORD: ${{ secrets.E2E_USER_K_PASSWORD }}
      E2E_USER_L_EMAIL: ${{ secrets.E2E_USER_L_EMAIL }}
      E2E_USER_L_PASSWORD: ${{ secrets.E2E_USER_L_PASSWORD }}
      E2E_USER_M_EMAIL: ${{ secrets.E2E_USER_M_EMAIL }}
      E2E_USER_M_PASSWORD: ${{ secrets.E2E_USER_M_PASSWORD }}
      E2E_USER_N_EMAIL: ${{ secrets.E2E_USER_N_EMAIL }}
      E2E_USER_N_PASSWORD: ${{ secrets.E2E_USER_N_PASSWORD }}
      E2E_USER_O_EMAIL: ${{ secrets.E2E_USER_O_EMAIL }}
      E2E_USER_O_PASSWORD: ${{ secrets.E2E_USER_O_PASSWORD }}
      E2E_USER_P_EMAIL: ${{ secrets.E2E_USER_P_EMAIL }}
      E2E_USER_P_PASSWORD: ${{ secrets.E2E_USER_P_PASSWORD }}
      E2E_USER_R_EMAIL: ${{ secrets.E2E_USER_R_EMAIL }}
      E2E_USER_R_PASSWORD: ${{ secrets.E2E_USER_R_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - name: Random webhook signing keys for this run
        run: |
          dodo="whsec_$(openssl rand -base64 32)"
          clerk="whsec_$(openssl rand -base64 32)"
          echo "::add-mask::$dodo"
          echo "::add-mask::$clerk"
          echo "DODO_PAYMENTS_WEBHOOK_KEY=$dodo" >> "$GITHUB_ENV"
          echo "CLERK_WEBHOOK_SIGNING_SECRET=$clerk" >> "$GITHUB_ENV"
          # P4: the signed onboarding / activation cookies and the trial-ledger pepper (web, worker and the persona tool).
          cookie="$(openssl rand -base64 32)"
          pepper="$(openssl rand -hex 32)"
          echo "::add-mask::$cookie"
          echo "::add-mask::$pepper"
          echo "SIGNED_COOKIE_SECRET=$cookie" >> "$GITHUB_ENV"
          echo "HASH_PEPPER=$pepper" >> "$GITHUB_ENV"
      - name: Random socket keys for this run (web ↔ socket token and HMAC rings)
        # One ring with the web's, the socket's and the worker's keys, plus the web's worker-only key `webwk`; each
        # process signs with its own kid (the web with the first, the socket and the worker reorder it; the worker gets
        # only wk, ws and webwk: e2e/fixtures/analysis-worker.ts ringSignedBy, workerRing).
        run: |
          tok="d1:$(openssl rand -base64 32)"
          int="web:$(openssl rand -base64 32),ws:$(openssl rand -base64 32),wk:$(openssl rand -base64 32),webwk:$(openssl rand -base64 32)"
          echo "::add-mask::$tok"
          echo "::add-mask::$int"
          echo "SOCKET_TOKEN_SECRET=$tok" >> "$GITHUB_ENV"
          echo "INTERNAL_API_SECRET=$int" >> "$GITHUB_ENV"
      - name: Migrate and seed the Docker database
        # seed:content writes the design legends and their positions (prisma/fixtures/design-legend-positions.ts):
        # friend-full and the G-STUDY fixture start on a legend position (phase-02 plan 6.8, 12.6). Its fixture
        # source accepts a loopback Postgres as well as the Neon dev endpoint (seed-guards.ts).
        run: |
          pnpm --filter @repo/db generate
          pnpm --filter @repo/db migrate:deploy
          pnpm --filter @repo/db seed
          pnpm --filter @repo/db seed:openings
          pnpm --filter @repo/db seed:content -- --apply
      - name: Socket and worker roles (roles.sql, socket.p3.sql, replay_worker.sql), as on OCI
        run: |
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          RT_PW=$(openssl rand -hex 16)
          WK_PW=$(openssl rand -hex 16)
          echo "::add-mask::$RT_PW"
          echo "::add-mask::$WK_PW"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v rt_password="$RT_PW" -f packages/db/sql/roles.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/scripts/roles/socket.p3.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v wk_password="$WK_PW" -f packages/db/scripts/roles/replay_worker.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/scripts/roles/replay_worker.p4.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/scripts/roles/replay_worker.p5.sql
          echo "E2E_SOCKET_DATABASE_URL=postgresql://replay_realtime:$RT_PW@localhost:5432/replay" >> "$GITHUB_ENV"
          echo "E2E_WORKER_DATABASE_URL=postgresql://replay_worker:$WK_PW@localhost:5432/replay" >> "$GITHUB_ENV"
      - name: Build (test app env, hooks on, sinks on)
        run: pnpm --filter web build
      - name: Authz walker over HTTP (signed out, against next start)
        working-directory: apps/web
        run: |
          pnpm start > ../../next-start.log 2>&1 &
          echo $! > ../../next-start.pid
          for _ in $(seq 1 60); do curl -fsS http://localhost:3000/api/health > /dev/null && break; sleep 1; done
          AUTHZ_BASE_URL=http://localhost:3000 pnpm exec tsx --test test/authz/walker.test.ts
      - name: Stop next start
        if: always()
        # `pnpm start` forks next-server; stop both so Playwright's webServer gets port 3000.
        run: |
          if [ -f next-start.pid ]; then kill "$(cat next-start.pid)" 2>/dev/null || true; fi
          pkill -f "next-server" 2>/dev/null || true
          pkill -f "next start" 2>/dev/null || true
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:3000 2>/dev/null || break; sleep 1; done
      - name: Playwright @smoke (chromium + webkit-iphone + game-serial; quarantine excluded)
        # Global setup provisions the users rows, entitles A–P and runs the fixture health check. The config
        # starts `pnpm start`, the :3002 and :3102 socket servers from source, the :3003 analysis worker from source
        # (ENGINE=fake) and the PostHog sink (POSTHOG_HOST above); game-serial (restart-resume, review/serial) runs
        # last with its own restartable :3103 server. The P3 specs seed member A's reviews themselves (_lib/review.ts).
        # E2E_SMOKE=1, not `--grep @smoke`: game-serial depends on chromium, play-queue and webkit-iphone, and a CLI
        # grep does not reach dependency projects, so they would run in full (the whole chromium suite, with the
        # specs that need real Dodo test-mode keys). The config grep filters every project.
        env:
          E2E_SMOKE: "1"
        run: pnpm --filter web exec playwright test --project=chromium --project=webkit-iphone --project=game-serial
      - name: P5 Train, Mistake Bank, puzzles and Home specs (@p5, chromium; the shard server and leased personas)
        # phase-05 plan §12.4 PR tier: every @p5 spec (e2e/specs/train/**, home, request-budget, a11y/train) on the same
        # build and servers; the puzzle specs read the committed shard subset from the CI shard server on :4012
        # (playwright.config.ts starts it), never R2. Runs after the smoke step even when that failed, so a P5 change
        # always reports its own specs.
        if: success() || failure()
        env:
          E2E_PHASES: "5"
        run: pnpm --filter web exec playwright test --project=chromium
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-smoke-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/results.json
            next-start.log
          retention-days: 14
          if-no-files-found: ignore

  devices-game:
    # P2 plan 12.7 tiering: the game's one-viewport suite on the 4 PR projects (desktop-1440@100, desktop-1280@125,
    # iphone@100, ipad-portrait@100) against a CI-local production build; nightly runs all 40 projects.
    needs: verify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      CI: "1"
      DEVICES_TIER: pr
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_DSN: ""
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ""
      DATABASE_URL: postgresql://ci:ci@localhost:5432/none
      DIRECT_URL: postgresql://ci:ci@localhost:5432/none
      # The Clerk development instance, as in nightly devices-full: with a development key Clerk's middleware answers
      # a first document request without a dev-browser cookie (every Playwright context) with a handshake redirect to
      # the key's Frontend API, /dev/ui/** included. The dummy key of the verify build names clerk.example.com, which
      # does not resolve, so every page.goto failed with net::ERR_NAME_NOT_RESOLVED.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_WEBSOCKET_URL: ws://localhost:3002
      DODO_PAYMENTS_API_KEY: ci-dummy-dodo-key
      DODO_PAYMENTS_ENVIRONMENT: test_mode
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @repo/db generate
      - name: Game one-viewport (/dev/ui/game, builds .next-devices, serves :3100)
        run: pnpm --filter web exec playwright test -c e2e/devices/game/game.config.ts one-viewport
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: devices-game-report
          path: apps/web/playwright-report-devices/
          retention-days: 14
          if-no-files-found: ignore

  devices-p4:
    # phase-04 plan §12.4: the onboarding steps, /settings/connected and the activation card in every demo state on the PR
    # tier (desktop-1440@100, desktop-1280@125, iphone@100, ipad-portrait@100; nightly devices-full runs all 40), the
    # CLS ≤ 0.05 lab gate of onboarding and the checkout return (plan §9.1), and axe on every P4 demo state in both
    # themes (ui-desktop, ui-iphone). Demo routes only: no database rows are read.
    needs: verify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      CI: "1"
      DEVICES_TIER: pr
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_DSN: ""
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ""
      DATABASE_URL: postgresql://ci:ci@localhost:5432/none
      DIRECT_URL: postgresql://ci:ci@localhost:5432/none
      # The Clerk development instance (as devices-game): Clerk's middleware handshake needs a resolvable Frontend API.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_WEBSOCKET_URL: ws://localhost:3002
      DODO_PAYMENTS_API_KEY: ci-dummy-dodo-key
      DODO_PAYMENTS_ENVIRONMENT: test_mode
      FLAGS_OVERRIDE: shell-v3:on,live-protocol-v2:on,game-v3:on,review-v3:on,review-share:on,onboarding-v3:on,import-v3:on
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @repo/db generate
      - name: Onboarding, connected accounts and activating one viewport + CLS (builds .next-devices, serves :3100)
        run: pnpm --filter web exec playwright test -c playwright.devices.config.ts layout/onboarding.spec.ts layout/settings-connected.spec.ts layout/activating.spec.ts
      - name: axe on every P4 demo state, light and dark
        run: pnpm --filter web exec playwright test -c playwright.devices.config.ts ui/onboarding.a11y.spec.ts --project=ui-desktop --project=ui-iphone
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: devices-p4-report
          path: apps/web/playwright-report-devices/
          retention-days: 14
          if-no-files-found: ignore

  devices-p5:
    # phase-05 plan §12.4: the Train screens and Home in every demo state (+ stress=1 at 150 %) on the PR tier
    # (desktop-1440@100, desktop-1280@125, iphone@100, ipad-portrait@100; nightly devices-full runs all 40), the runner CLS
    # ≤ 0.02 lab gate, move → verdict with a 4× CPU throttle on desktop-1440@100, and the real routes as a leased
    # `bank-member` on desktop-1440@100 and iphone@100. The real routes need the Docker database and the CI shard server
    # (playwright.devices.config.ts starts it with the build; never R2).
    needs: verify
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    services:
      db:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: replay }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      CI: "1"
      DEVICES_TIER: pr
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_DSN: ""
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ""
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/replay
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/replay
      # The Clerk development instance (as devices-review): the middleware handshake needs a resolvable Frontend API, and
      # the real-route test signs a pool user in with a Clerk testing token.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_WEBSOCKET_URL: ws://localhost:3002
      DODO_PAYMENTS_API_KEY: ci-dummy-dodo-key
      DODO_PAYMENTS_ENVIRONMENT: test_mode
      BILLING_PAYWALL: "on"
      FLAGS_OVERRIDE: shell-v3:on,live-protocol-v2:on,game-v3:on,review-v3:on,review-share:on,onboarding-v3:on,import-v3:on,train:on,home:on,bank-remove:on
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - name: Random keys for this run (the persona tool's ledger pepper and the signed cookies)
        run: |
          cookie="$(openssl rand -base64 32)"
          pepper="$(openssl rand -hex 32)"
          echo "::add-mask::$cookie"
          echo "::add-mask::$pepper"
          echo "SIGNED_COOKIE_SECRET=$cookie" >> "$GITHUB_ENV"
          echo "HASH_PEPPER=$pepper" >> "$GITHUB_ENV"
      - name: Migrate and seed the Docker database
        run: |
          pnpm --filter @repo/db generate
          pnpm --filter @repo/db migrate:deploy
          pnpm --filter @repo/db seed
          pnpm --filter @repo/db seed:openings
      - name: Train and Home one viewport, the runner lab gates, the real routes (builds .next-devices, serves :3100)
        run: pnpm --filter web exec playwright test -c playwright.devices.config.ts layout/train.spec.ts layout/home.spec.ts
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: devices-p5-report
          path: apps/web/playwright-report-devices/
          retention-days: 14
          if-no-files-found: ignore

