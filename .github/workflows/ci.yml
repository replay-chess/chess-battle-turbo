      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/replay
      # The Clerk development instance, as in devices-game: Clerk's middleware answers a first document request without
      # a dev-browser cookie with a handshake redirect to the key's Frontend API (/dev/ui/** and /how-we-grade included).
      # The verify build's dummy key names clerk.example.com, which does not resolve: every page.goto of run
      # 43401675366 failed with net::ERR_NAME_NOT_RESOLVED (chromium) or "Error resolving clerk.example.com" (webkit).
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_WEBSOCKET_URL: ws://localhost:3002
      DODO_PAYMENTS_API_KEY: ci-dummy-dodo-key
      DODO_PAYMENTS_ENVIRONMENT: test_mode
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
