name: Performance Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "legacy = the perf-environment game scenarios; me = GET /api/me against the dev deployment (phase-01 plan §9.7)"
        type: choice
        options: [legacy, me]
        default: legacy
      web_app_url:
        description: "me only: deployment to test (never production)"
        default: https://replay-chess-dev-replaychess007-1069.vercel.app

jobs:
  perf:
    if: inputs.suite == 'legacy'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      # k6 reads system env into __ENV: the scenarios send it as x-perf-token (plan H9; the server
      # ignores PERF_AUTH_BYPASS without a matching PERF_TOKEN and with test hooks off).
      PERF_TOKEN: ${{ secrets.PERF_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install k6
        run: |
          K6_VERSION="v1.6.0"
          curl -sL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" -o /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv /tmp/k6-${K6_VERSION}-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: pnpm install --filter chess-battle-perf-k6

      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.PERF_DATABASE_URL }}" ]; then
            echo "::error::PERF_DATABASE_URL secret is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi

      - name: Fetch user manifest from DB
        env:
          PERF_DATABASE_URL: ${{ secrets.PERF_DATABASE_URL }}
        run: |
          DB_URL="${PERF_DATABASE_URL/&channel_binding=require/}"
          psql "$DB_URL" -t -A -c "
            SELECT json_agg(row_to_json(t))
            FROM (
              SELECT \"googleId\" as \"clerkId\", email, \"referenceId\"
              FROM users
              WHERE email LIKE 'perfscale-%@chessbattle.dev'
              ORDER BY email
              LIMIT 20000
            ) t;
          " | jq '.' > perf/k6/setup/user-manifest.json
          COUNT=$(jq length perf/k6/setup/user-manifest.json)
          echo "Loaded $COUNT users from DB"
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::Not enough perf users in DB. Run generate-db-users.ts first."
            exit 1
          fi

      - name: Build k6 scenarios
        run: cd perf/k6 && pnpm run build

      - name: Run play-with-friend perf test
        id: ws_games
        run: |
          cd perf/k6
          k6 run dist/ws-games.js -e WS_VUS=30 -e WS_ITERS=3 \
            --summary-export=/tmp/ws-games-summary.json \
            2>&1 | tee /tmp/ws-games.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Run quick-match perf test
        id: quick_match
        if: always()
        run: |
          cd perf/k6
          k6 run dist/quick-match.js -e QM_VUS=100 -e QM_GAMES=1 -e QM_STAGGER=30 \
            --summary-export=/tmp/quick-match-summary.json \
            2>&1 | tee /tmp/quick-match.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Run tournament perf test
        id: tournament
        if: always()
        run: |
          cd perf/k6
          k6 run dist/tournament.js -e T_VUS=100 -e T_DURATION=5 \
            --summary-export=/tmp/tournament-summary.json \
            2>&1 | tee /tmp/tournament.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Generate results report
        if: always()
        run: |
          cat > /tmp/perf-results.md << 'HEADER'
          # Performance Test Results

          **Run:** ${{ github.run_id }} | **Commit:** ${{ github.sha }} | **Date:** $(date -u +"%Y-%m-%d %H:%M UTC")
          **Branch:** ${{ github.ref_name }} | **Triggered by:** ${{ github.actor }}

          ---
          HEADER

          for test in ws-games quick-match tournament; do
            echo "" >> /tmp/perf-results.md
            echo "## ${test}" >> /tmp/perf-results.md
            echo "" >> /tmp/perf-results.md

            if [ -f "/tmp/${test}-summary.json" ]; then
              # Extract thresholds pass/fail
              echo "### Thresholds" >> /tmp/perf-results.md
              echo "" >> /tmp/perf-results.md
              echo '```' >> /tmp/perf-results.md
              grep -E "✓|✗|passing|failing|thresholds" /tmp/${test}.log | tail -10 >> /tmp/perf-results.md
              echo '```' >> /tmp/perf-results.md
              echo "" >> /tmp/perf-results.md

              # Extract key metrics from summary JSON
              echo "### Key Metrics" >> /tmp/perf-results.md
              echo "" >> /tmp/perf-results.md
              echo "| Metric | Value |" >> /tmp/perf-results.md
              echo "|--------|-------|" >> /tmp/perf-results.md

              if [ -f "/tmp/${test}-summary.json" ]; then
                node -e "
                  const s = require('/tmp/${test}-summary.json');
                  const m = s.metrics || {};
                  const fmt = (v) => typeof v === 'number' ? (v > 1 ? v.toFixed(2) : (v * 100).toFixed(1) + '%') : v;
                  const rows = [];
                  for (const [k, v] of Object.entries(m)) {
                    if (v.values) {
                      if (v.type === 'rate') rows.push([k, fmt(v.values.rate)]);
                      else if (v.type === 'trend') rows.push([k, 'avg=' + (v.values.avg||0).toFixed(0) + 'ms p95=' + (v.values['p(95)']||0).toFixed(0) + 'ms']);
                      else if (v.type === 'counter') rows.push([k, v.values.count]);
                    }
                  }
                  rows.forEach(([k,v]) => console.log('| ' + k + ' | ' + v + ' |'));
                " >> /tmp/perf-results.md 2>/dev/null
              fi
            else
              echo "**Skipped or failed to produce results.**" >> /tmp/perf-results.md
            fi

            echo "" >> /tmp/perf-results.md

            # Extract final summary lines from k6 log
            echo "<details><summary>Full k6 output</summary>" >> /tmp/perf-results.md
            echo "" >> /tmp/perf-results.md
            echo '```' >> /tmp/perf-results.md
            tail -60 /tmp/${test}.log >> /tmp/perf-results.md 2>/dev/null
            echo '```' >> /tmp/perf-results.md
            echo "</details>" >> /tmp/perf-results.md
            echo "" >> /tmp/perf-results.md
            echo "---" >> /tmp/perf-results.md
          done

          cat /tmp/perf-results.md

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-results-${{ github.sha }}
          path: |
            /tmp/perf-results.md
            /tmp/ws-games-summary.json
            /tmp/quick-match-summary.json
            /tmp/tournament-summary.json
            /tmp/ws-games.log
            /tmp/quick-match.log
            /tmp/tournament.log
          retention-days: 30

      - name: Post results to job summary
        if: always()
        run: cat /tmp/perf-results.md >> $GITHUB_STEP_SUMMARY

      - name: Check thresholds
        if: always()
        run: |
          failed=0
          grep -q "thresholds on metrics.*failed" /tmp/ws-games.log 2>/dev/null && failed=1
          grep -q "thresholds on metrics.*failed" /tmp/quick-match.log 2>/dev/null && failed=1
          grep -q "thresholds on metrics.*failed" /tmp/tournament.log 2>/dev/null && failed=1
          if [ "$failed" = "1" ]; then
            echo "::error::One or more perf tests failed their thresholds"
            exit 1
          fi
          echo "All perf thresholds passed!"

  # GET /api/me (phase-01 plan §9.1, §9.7, §12.8): 20 VUs × 2 min, then 1 min of If-None-Match.
  # Thresholds: me p95 < 150 ms (abortOnFail), checks > 99 %, 304 rate > 95 %. The JSON summary is uploaded as
  # perf/results/p01-me-<sha>.json; commit it to perf/results/ (the workflow cannot write to the repo), and
  # perf/compare.ts compares it with the previous phase's file.
  # Secrets: CLERK_SECRET_KEY (Clerk DEVELOPMENT instance: sessions are minted through its Backend API),
  # E2E_USER_A..D_EMAIL (existing dev users), VERCEL_AUTOMATION_BYPASS_SECRET (after Q-16, optional).
  me:
    if: inputs.suite == 'me'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      WEB_APP_URL: ${{ inputs.web_app_url }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      ME_USER_EMAILS: ${{ secrets.E2E_USER_A_EMAIL }},${{ secrets.E2E_USER_B_EMAIL }},${{ secrets.E2E_USER_C_EMAIL }},${{ secrets.E2E_USER_D_EMAIL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Refuse production
        run: |
          case "$WEB_APP_URL" in
            *playchess.tech*|*replay-chess.vercel.app*) echo "::error::k6 never runs against production"; exit 1 ;;
          esac
      - name: Install k6
        run: |
          K6_VERSION="v1.6.0"
          curl -sL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" -o /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv /tmp/k6-${K6_VERSION}-linux-amd64/k6 /usr/local/bin/k6
      - run: pnpm install --filter chess-battle-perf-k6 --filter . --frozen-lockfile
      - run: cd perf/k6 && pnpm run build
      - name: k6 me
        id: me
        run: |
          mkdir -p perf/results
          sha="$(git rev-parse --short=7 HEAD)"
          echo "file=perf/results/p01-me-${sha}.json" >> "$GITHUB_OUTPUT"
          cd perf/k6
          k6 run dist/me.js -e RESULT_FILE="../results/p01-me-${sha}.json" 2>&1 | tee /tmp/me.log
          exit "${PIPESTATUS[0]}"
      - name: Compare with the previous phase (fails on a > 15 % regression)
        if: always() && steps.me.outputs.file != ''
        run: pnpm exec tsx perf/compare.ts --phase 1 --scenario me
      - name: Post results to job summary
        if: always()
        run: |
          {
            echo "### k6 GET /api/me"
            echo '```'
            tail -12 /tmp/me.log 2>/dev/null
            echo '```'
            echo "Commit \`${{ steps.me.outputs.file }}\` to record the result (plan §12.8)."
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-me-${{ github.sha }}
          path: |
            ${{ steps.me.outputs.file }}
            /tmp/me.log
          retention-days: 30
          if-no-files-found: ignore
