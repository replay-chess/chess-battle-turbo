  # ── P3 chess correctness on arm64 (phase-03 plan §12.4, TST X13) ───────────────────────────────────────────────
  # Stockfish 18 is built from the worker image's own stage (apps/analysis-worker/Dockerfile `--target stockfish`:
  # sf_18 at the pinned commit, `make profile-build ARCH=armv8-dotprod`), so the nightly engine is the dev box's.
  p3-goldens:
    # Byte-identical GameAnalysis + PlayerReview.content for the 10 committed goldens (packages/chess-analysis/fixtures/
    # golden/*.json) under the determinism rules (cache off, a fresh engine per game, Threads 1, no resume); plus the
    # real-engine UCI driver test. With no goldens committed yet the job fails and uploads the proposed files to review.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.REF }}" }
      - uses: useblacksmith/setup-docker-builder@v1
      - name: Stockfish 18 (the worker Dockerfile's stockfish stage)
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/analysis-worker/Dockerfile
          target: stockfish
          platforms: linux/arm64
          load: true
          push: false
          tags: rc-stockfish:nightly
      - name: Extract the binary
        run: |
          id=$(docker create rc-stockfish:nightly)
          docker cp "$id:/out/stockfish" "$RUNNER_TEMP/stockfish"
          docker cp "$id:/out/doc/BUILD_INFO" "$RUNNER_TEMP/BUILD_INFO"
          docker rm "$id"
          cat "$RUNNER_TEMP/BUILD_INFO"
          echo "SF_PATH=$RUNNER_TEMP/stockfish" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Real-engine UCI driver test (src/engine/uci.test.ts runs its engine cases with ENGINE_PATH)
        run: ENGINE_PATH="$SF_PATH" pnpm --filter analysis-worker exec tsx --test src/engine/uci.test.ts
      - name: Goldens byte-identical (make-golden --check)
        run: |
          mkdir -p perf/results
          pnpm --filter analysis-worker exec tsx scripts/make-golden.ts --engine "$SF_PATH" --check \
            --report "$GITHUB_WORKSPACE/perf/results/p03-goldens-${GITHUB_SHA}.json"
      - name: Proposed goldens (when the check failed; review, then commit under fixtures/golden)
        if: failure()
        run: pnpm --filter analysis-worker exec tsx scripts/make-golden.ts --engine "$SF_PATH" --write --out "$RUNNER_TEMP/golden-proposed"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p3-goldens
          path: |
            perf/results/p03-goldens-*.json
            ${{ runner.temp }}/golden-proposed/
            ${{ runner.temp }}/BUILD_INFO
          retention-days: 30
          if-no-files-found: ignore

  p3-label-stability:
    # The same 10 games with the eval cache warm and with a forced failure at ply 20 + the resumed retry: labels equal
    # on ≥ 98 % of plies and on every key moment, accuracy within ±0.5. On a failure, record the P3-D10 decision
    # (graded positions bypass the cache) in packages/chess-analysis/README.md "Decisions recorded here".
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.REF }}" }
      - uses: useblacksmith/setup-docker-builder@v1
      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/analysis-worker/Dockerfile
          target: stockfish
          platforms: linux/arm64
          load: true
          push: false
          tags: rc-stockfish:nightly
      - name: Extract the binary
        run: |
          id=$(docker create rc-stockfish:nightly)
          docker cp "$id:/out/stockfish" "$RUNNER_TEMP/stockfish"
          docker rm "$id"
          echo "SF_PATH=$RUNNER_TEMP/stockfish" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Label stability (make-golden --stability)
        run: |
          mkdir -p perf/results
          pnpm --filter analysis-worker exec tsx scripts/make-golden.ts --engine "$SF_PATH" --stability \
            --report "$GITHUB_WORKSPACE/perf/results/p03-label-stability-${GITHUB_SHA}.json"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p3-label-stability
          path: perf/results/p03-label-stability-*.json
          retention-days: 30
          if-no-files-found: ignore

  p3-eval-provenance:
    # Every stored eval in FX/grades/positions.jsonl, CA fixtures/labels and fixtures/golden is within ±30 cp of the
    # sf18-v1 pass-1 search (or the same mate), so the corpora never drift from the real engine.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ env.REF }}" }
      - uses: useblacksmith/setup-docker-builder@v1
      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/analysis-worker/Dockerfile
          target: stockfish
          platforms: linux/arm64
          load: true
          push: false
          tags: rc-stockfish:nightly
      - name: Extract the binary
        run: |
          id=$(docker create rc-stockfish:nightly)
          docker cp "$id:/out/stockfish" "$RUNNER_TEMP/stockfish"
          docker rm "$id"
          echo "SF_PATH=$RUNNER_TEMP/stockfish" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Eval provenance (exit 1 = drift)
        run: |
          mkdir -p perf/results
          ENGINE_PATH="$SF_PATH" pnpm --filter @repo/chess-analysis eval-provenance \
            --report "$GITHUB_WORKSPACE/perf/results/p03-eval-provenance-${GITHUB_SHA}.json"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p3-eval-provenance
          path: perf/results/p03-eval-provenance-*.json
          retention-days: 30
          if-no-files-found: ignore
