name: Deploy WebSocket to OCI

# Builds the arm64 websocket image on GitHub's arm runners (the OCI Ampere A1
# server is arm64), pushes it to GHCR, then pulls and restarts the stack on
# the server. The Next.js app stays on Vercel.
#
# Secrets:
#   WS_ENV_FILE  websocket server .env (see deploy/oci/.env.example); written
#                to /opt/replay-chess/.env on the server
#   OCI_HOST     server public IP
#   OCI_SSH_KEY  private key of the `deploy` user (deploy/oci/setup-server.sh)

on:
  push:
    branches: [main]
    paths:
      - "apps/web-socket/**"
      - "deploy/oci/**"
      - ".github/workflows/deploy-oci.yml"
  workflow_dispatch:

concurrency:
  group: deploy-oci
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  WS_IMAGE: ghcr.io/${{ github.repository_owner }}/replay-chess-websocket:${{ github.sha }}

jobs:
  build:
    # Native arm64 build; free for public repos
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push websocket
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-socket/Dockerfile
          push: true
          tags: ${{ env.WS_IMAGE }}
          cache-from: type=gha,scope=websocket
          cache-to: type=gha,scope=websocket,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/oci

      - name: Assemble bundle
        run: |
          mkdir -p bundle
          cp deploy/oci/docker-compose.yml deploy/oci/Caddyfile bundle/
          {
            printf '%s\n' "$WS_ENV_FILE"
            echo "WS_IMAGE=$WS_IMAGE"
          } > bundle/.env
        env:
          WS_ENV_FILE: ${{ secrets.WS_ENV_FILE }}

      - name: Copy bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: deploy
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "bundle/docker-compose.yml,bundle/Caddyfile,bundle/.env"
          target: /opt/replay-chess
          strip_components: 1

      - name: Restart stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: deploy
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            cd /opt/replay-chess
            chmod 600 .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            docker compose ps
