# gitleaks configuration (phase-01 plan §11.2 H5, 1B·H).
#
# CI (1B·F7, ci.yml) scans the full history against the baseline:
#   docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo \
#     --log-opts=--all --redact --no-banner \
#     --config /repo/.gitleaks.toml --baseline-path /repo/.gitleaks-baseline.json
#
# `--redact` is required: the committed baseline is redacted (it never holds a secret
# value), and gitleaks compares a finding's Secret and Match with the baseline only when
# redaction is off. Any finding that is not in the baseline fails the job.
#
# The baseline records the historical leaks in the deleted k8s/secrets.yaml (two Clerk
# development secret keys and a live database URL). Deleting the file does not remove them
# from history: the owner rotates those credentials (Q-02); the baseline only keeps the
# scan green for commits that cannot change.

title = "Replay Chess"

[extend]
useDefault = true

# The default rules have no PostgreSQL rule, so a connection string with an inline password
# passed the old scans unnoticed. This one flags any non-local one.
[[rules]]
id = "postgres-url-with-password"
description = "PostgreSQL connection string with an inline password"
regex = '''postgres(?:ql)?://[^:@\s/'"`]+:([^@\s'"`]+)@([A-Za-z0-9.-]+)'''
secretGroup = 1
keywords = ["postgres://", "postgresql://"]

  [[rules.allowlists]]
  description = "Local, Docker and CI databases"
  regexTarget = "match"
  regexes = ['''@(localhost|127\.0\.0\.1|0\.0\.0\.0|db|postgres|shadow|host\.docker\.internal)$''']

  [[rules.allowlists]]
  description = "Placeholders and variable references"
  regexTarget = "secret"
  regexes = [
    '''^(password|passwd|pass|pw|secret|changeme|PASSWORD|\*+|x+|X+)$''',
    '''^\$\{?[A-Za-z_][A-Za-z0-9_]*\}?$''',
    '''^<[^>]*>$''',
    '''^\[[^\]]*\]$''',
  ]

[[allowlists]]
description = "Clerk publishable keys are public by design (they ship in the browser bundle)"
regexTarget = "secret"
regexes = ['''^pk_(test|live)_[A-Za-z0-9]+$''']

[[allowlists]]
description = "IndexNow keys are public by protocol (served at /<key>.txt)"
paths = ['''^apps/web/scripts/indexnow\.mjs$''', '''^apps/web/lib/indexnow\.ts$''']

[[allowlists]]
description = "Generated, vendored and lock files"
paths = [
  '''(^|/)pnpm-lock\.yaml$''',
  '''^apps/web/public/workers/''',
  '''^apps/web/app/generated/''',
]

[[allowlists]]
# Added by 1B·F7: the socket test harness (stage A, 9f2e480) holds a fixed, test-only
# INTERNAL_API_SECRET that the generic-api-key rule flags. Both conditions must hold, so a
# real secret pasted into the test tree is still reported.
description = "Fixed test-only secrets in the socket test harness"
condition = "AND"
paths = ['''^apps/web-socket/test/''']
regexTarget = "match"
regexes = ['''test-internal-secret-[0-9a-f]+''']

[[allowlists]]
# Phase 2 stage A (de4020c): fixed, made-up test values the generic-api-key rule flags. Path AND exact value
# must both match, so a real secret pasted into these files is still reported.
description = "Fixed test-only idempotency key and socket token fixtures"
condition = "AND"
paths = [
  '''^apps/web/lib/api/idempotency\.test\.ts$''',
  '''^apps/web/test/api/games-routes\.test\.ts$''',
  '''^packages/contracts/src/socket/test/fixtures\.ts$''',
]
regexTarget = "secret"
regexes = [
  '''^3f2b8c1e-9d4a-4b6f-8e2d-1a2b3c4d5e6f$''',
  '''^eyJ2IjoyfQ\.c2lnbmF0dXJlLW9mLXRoZS10b2tlbi1zaXh0eS1mb3VyLWNoYXJz$''',
]

[[allowlists]]
# Phase 3 (REGRESSION-3): the worker's env tests build made-up Neon URLs with the literal password `secretpw` to prove
# the production and endpoint guards refuse them. Path AND exact value must both match, so a real password pasted
# into the file is still reported.
description = "Fixed test-only database password in the worker env tests"
condition = "AND"
paths = ['''^apps/analysis-worker/src/boot\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^secretpw$''']
